# Surface Go 2 camera sensors from Linux v7.0 with the *-program-mode-on-stream-start.patch files:
# without them a mode set while the sensor stays powered (VCM device link on the rear ov8865,
# autosuspend delay on the front ov5693) never reaches the hardware and the stream stalls.
PACKAGE_NAME="surface-go2-cameras"
PACKAGE_VERSION="1.0"
BUILT_MODULE_NAME[0]="ov8865"
DEST_MODULE_LOCATION[0]="/updates/dkms"
BUILT_MODULE_NAME[1]="ov5693"
DEST_MODULE_LOCATION[1]="/updates/dkms"
AUTOINSTALL="yes"
# The sources are the v7.0 drivers. On any other kernel series, skip the build and fall back to
# Ubuntu's own modules instead of loading old code; refresh the sources and patches first.
BUILD_EXCLUSIVE_KERNEL="^7\.0\."
